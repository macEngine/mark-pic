## 📖 词汇卡片

![](https://blogimg.niuge6.com/i/5338115104929.png)

**damning** 英 /ˈdæmɪŋ/ 美 /ˈdæmɪŋ/
`六级` `托福` `GRE`

## 📰 今日例句

**damning** 是《纽约时报》（2026 年 5 月 18 日刊）播客 **"The Courtroom Showdown Between Elon Musk and Sam Altman"（马斯克与奥尔特曼的法庭对决）** 中出现的一个单词：

> There's a particularly **damning** article in The New Yorker a few weeks ago, basically painting him as just a fundamentally untrustworthy person.

**解析：**
damning 是动词 damn 的现在分词形容词形式。damn 源自拉丁语 damnare（判罪、谴责），词根 damnum 表示"损害、损失"——一个被 damn 的人或证据，相当于"被宣判有罪"的存在，即决定性地证明了某人的过错。

核心词根是 damn-（判罪、损失），相关词：
- **damn**（v. 谴责、诅咒）— 动词原形
- **damnation**（n. 诅咒、惩罚）— 加 -ation 名词化
- **condemn**（谴责、判刑）— con- + demn（damn 变形），"彻底定罪"
- **indemnity**（赔偿、保障）— in-（不）+ demn + -ity，"免于损失"
- **damage**（n./v. 损害）— 同根，"造成损失"

damning 描述的是"决定性不利的"——通常指某条证据、某段记录、某篇报道一旦曝光，就让被指控者百口莫辩。它不是"批评严厉"那么简单，而是"足以定罪"。与 critical（批评的）相比，damning 程度更重，强调"足以毁掉对方"；与 incriminating（足以入罪的）相比，damning 用法更广，可指道德、声誉而不限于法律。比如：

- 致命的证据 damning evidence
- 一篇极不利的报道 a damning report
- 言之凿凿的证词 damning testimony

那么回到上面《纽约时报》的句子，翻译成中文是：几周前《纽约客》上有一篇尤为**致命**的报道，基本上把他刻画成一个根本不值得信任的人。

## 🔄 近义词辨析

| 词汇 | 含义侧重 | 例句 |
|------|---------|------|
| **damning** | 决定性不利、足以毁掉对方 | The emails were damning. |
| **incriminating** | 足以使其入罪 | Police found incriminating documents. |
| **scathing** | 措辞严厉的批评 | A scathing review of the film. |
| **devastating** | 毁灭性的、压倒性的 | Devastating cross-examination. |

关于 damning 今天就看到这里。最后送各位一个关于 damning 的例句：

> Silence, in moments that demand a stand, can be the most **damning** verdict of all.
> —— 改编自 Martin Luther King Jr.

（在需要表态的时刻保持沉默，本身就可能是最**有罪**的判决。）

<script>
// parseMD + esc —— 原样来自 md-to-wechat.html
function parseMD(md) {
  var html = md
    .replace(/```(\w*)\n([\s\S]*?)```/g, function(_, lang, code) {
      return '<pre><code>' + esc(code.trimEnd()) + '</code></pre>';
    })
    .replace(/^### (.+)$/gm, '<h3>$1</h3>')
    .replace(/^## (.+)$/gm, '<h2>$1</h2>')
    .replace(/^# (.+)$/gm, '<h1>$1</h1>')
    .replace(/^---+$/gm, '<hr>')
    .replace(/^> (.+)$/gm, '<blockquote><p>$1</p></blockquote>')
    .replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<p style="margin:0 0 6px;padding:0;text-align:center;"><img alt="$1" src="$2" style="max-width:100%;height:auto;display:block;margin:12px auto 0;border-radius:8px;border:1px solid #ddd;"></p>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/^(\|.+\|)\n\|[-| :]+\|\n((?:\|.+\|\n?)*)/gm, function(_, header, body) {
      var ths = header.split('|').filter(Boolean).map(function(c){return '<th style="border:1px solid #ddd;padding:8px 12px;background:#f5f5f5;font-weight:bold;text-align:left;font-size:15px;line-height:1.8;white-space:nowrap;">'+c.trim()+'</th>'}).join('');
      var rows = body.trim().split('\n').map(function(r){
        var cells = r.split('|').filter(Boolean);
        return '<tr>'+cells.map(function(c,j){return '<td style="border:1px solid #ddd;padding:8px 12px;text-align:left;font-size:15px;line-height:1.8;'+(j===0?'white-space:nowrap;':'')+'">'+c.trim()+'</td>'}).join('')+'</tr>';
      }).join('');
      return '<table style="width:100%;border-collapse:collapse;margin:0 0 24px;font-size:15px;line-height:1.8;"><thead><tr>'+ths+'</tr></thead><tbody>'+rows+'</tbody></table>';
    })
    .replace(/(^[*\-] .+\n?)+/gm, function(block) {
      var items = block.trim().split('\n').map(function(l){return '<li>'+l.replace(/^[*\-] /,'')+'</li>'}).join('');
      return '<ul>'+items+'</ul>';
    })
    .replace(/(^\d+\. .+\n?)+/gm, function(block) {
      var items = block.trim().split('\n').map(function(l){return '<li>'+l.replace(/^\d+\. /,'')+'</li>'}).join('');
      return '<ol>'+items+'</ol>';
    });

  html = html.split('\n').map(function(line) {
    var t = line.trim();
    if (!t) return '';
    if (/^<(h[1-6]|p|ul|ol|li|blockquote|pre|hr|table|thead|tbody|tr|img|div)/.test(t)) return t;
    if (/\/.*\/.*\/.*\//.test(t)) return '<p style="text-align:center;font-size:15px;margin:0 0 2px;padding:0;line-height:1.4;">' + t + '</p>';
    if (/^(<code>[^<]+<\/code>\s*)+$/.test(t)) return '<p style="text-align:center;margin-bottom:12px;">' + t + '</p>';
    return '<p>' + t + '</p>';
  }).join('\n');

  html = html.replace(/<\/blockquote>\n?<blockquote>/g, '\n');
  return html;
}
function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

document.getElementById('preview').innerHTML =
  parseMD(document.getElementById('md').textContent.replace(/^\n/, ''));
</script>
